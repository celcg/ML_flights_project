[theme]
primaryColor = "#5B9BD5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F8FC"
textColor = "#17365D"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
corsAllowedOrigins = ["http://127.0.0.1:8501", "http://localhost:8501"]

[browser]
serverAddress = "localhost"
serverPort = 8501
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
