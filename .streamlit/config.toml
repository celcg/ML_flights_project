[theme]
base = "light"
primaryColor = "#2F6FB0"
backgroundColor = "#F2F6FA"
secondaryBackgroundColor = "#F7FAFC"
textColor = "#23364A"
linkColor = "#2F6FB0"
borderColor = "#D7E3ED"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "large"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["36px", "27px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
linkUnderline = false

blueColor = "#2F6FB0"
greenColor = "#2E8B68"
redColor = "#C35D5D"
orangeColor = "#B7791F"
yellowColor = "#B38A20"
violetColor = "#7458A6"
grayColor = "#66788A"

chartCategoricalColors = ["#2F6FB0", "#2E8B68", "#7458A6", "#B7791F", "#C35D5D", "#4F7F91", "#7B8794"]
chartSequentialColors = ["#F4F8FC", "#DFECF6", "#C8DFF0", "#A8CAE4", "#82B2D6", "#5C97C6", "#3F7DB6", "#2F6FB0", "#24578A", "#173B5F"]
dataframeBorderColor = "#D7E3ED"
dataframeHeaderBackgroundColor = "#EDF4F9"

[theme.sidebar]
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#1A2B3B"
textColor = "#EAF3FA"
borderColor = "#28323D"
primaryColor = "#7FAED8"

[server]
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
